name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Репозиторий публичный: ключи и пароли в коммитах не должны попасть в историю.
  # Ложные срабатывания — в .gitleaksignore (отпечатки из `gitleaks git --redact -v`).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aesculap
          POSTGRES_PASSWORD: aesculap
          POSTGRES_DB: aesculap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aesculap" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://aesculap:aesculap@localhost:5432/aesculap_test
      REDIS_URL: redis://localhost:6379/6
      WEB_ORIGIN: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      # ffmpeg/ffprobe — постеры и проверка длины видео (тест медиа поставщика), как в Dockerfile API
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aesculap/shared build
      - run: pnpm --filter @aesculap/api exec prisma migrate deploy
      - run: pnpm --filter @aesculap/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
